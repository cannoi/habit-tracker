<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Track daily habits, streaks, history and progress statistics.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <div class="container" id="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
    </header>
    <main id="view" aria-live="polite"></main>
    <noscript><p class="muted center">Habit Tracker needs JavaScript to run.</p></noscript>
  </div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
