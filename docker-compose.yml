services:
  app:
    image: ghcr.io/OWNER/habit-tracker:latest
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      - PORT=8080
      # Optional: set your own secret (16+ chars). If omitted, a random one is generated and stored in the data volume.
      # - JWT_SECRET=change-me-to-a-long-random-string
    volumes:
      - habit_data:/usr/src/app/data

volumes:
  habit_data:
